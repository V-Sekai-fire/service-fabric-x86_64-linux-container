[workspace]
name = "fabric"
channels = ["conda-forge"]
platforms = ["linux-64", "win-64"]

# Every task shells out to podman, which the host provides (the host machine).
[tasks]
build  = "podman build -t localhost/fabric-runtime:dev -f runtime/Containerfile runtime"
run    = { cmd = "sh runtime/run.sh", depends-on = ["build"] }
stop   = "podman stop -t 60 fabric"
health = "podman healthcheck run fabric && echo healthy"
logs   = "podman logs --tail 200 fabric"
check  = "sh runtime/selftest.sh"
